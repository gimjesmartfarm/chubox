name: Update chive price

on:
  schedule:
    # 22:57 UTC = 한국시간 익일 07:57 (경매 갱신 직후)
    # 정각(:00)은 혼잡해 지연/누락이 잦으므로 일부러 분을 어긋나게 둠
    # 단, GitHub 예약 실행은 정시를 보장하지 않고 지연/누락될 수 있음
    - cron: "57 22 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5          # Node 24 지원
      - uses: actions/setup-python@v6      # Node 24 지원
        with:
          python-version: "3.12"

      - name: Fetch price
        env:
          KAT_SERVICE_KEY: ${{ secrets.KAT_SERVICE_KEY }}
        run: python fetch_price.py

      - name: Commit price.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --quiet --cached || git commit -m "Update price ($(TZ=Asia/Seoul date +%F))"
          git push
