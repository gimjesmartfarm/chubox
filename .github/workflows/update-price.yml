name: Update chive price

on:
  workflow_dispatch: {}   # 수동 실행 버튼 for Cloudflare

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5          # Node 24 지원
      - uses: actions/setup-python@v6      # Node 24 지원
        with:
          python-version: "3.12"

      - name: Fetch price
        env:
          KAT_SERVICE_KEY: ${{ secrets.KAT_SERVICE_KEY }}
        run: python fetch_price.py

      - name: Commit price.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --quiet --cached || git commit -m "Update price ($(TZ=Asia/Seoul date +%F))"
          git push
